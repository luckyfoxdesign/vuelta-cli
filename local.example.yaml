# Policy for `vuelta package local`. Pass this file explicitly with --policy;
# it is intentionally separate from config.yaml, so local mode does not need a
# Git repository, Docker daemon, registry proxy, or notification credentials.
# Keep this allowlist limited to direct dependencies you intend Vuelta to edit.
allowed_packages:
  - "example-package"
  - "@example/scope-package"

# npm can enforce this on its read-only scan. Other managers report clearly
# when they cannot enforce it; Vuelta never claims the age gate ran when it did
# not. Set 0 to disable the request.
min_release_age_days: 7

# Default false. A project .npmrc/.yarnrc.yml/pip.conf/poetry.toml equivalent
# can change registries, proxies, plugins, or script shells. Review it before
# enabling this, or pass --allow-project-config for one invocation.
allow_project_config: false
