name: Vuelta update engine

on:
  workflow_call:
    inputs:
      request_id:
        required: true
        type: string
      base_commit:
        required: true
        type: string
      policy_version:
        required: true
        type: string
      cooldown_days:
        required: true
        type: string
      include_major:
        required: true
        type: string
      engine_ref:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vuelta-update-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      branch: ${{ steps.result.outputs.branch }}
      pull_request_url: ${{ steps.pull_request.outputs.url }}
    steps:
      - name: Validate closed workflow inputs
        env:
          BASE_COMMIT: ${{ inputs.base_commit }}
          COOLDOWN_DAYS: ${{ inputs.cooldown_days }}
          ENGINE_REF: ${{ inputs.engine_ref }}
          INCLUDE_MAJOR: ${{ inputs.include_major }}
          POLICY_VERSION: ${{ inputs.policy_version }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          case "$BASE_COMMIT" in
            (*[!0-9a-f]*|'') exit 2 ;;
          esac
          test "${#BASE_COMMIT}" -eq 40
          case "$ENGINE_REF" in
            (*[!0-9a-f]*|'') exit 2 ;;
          esac
          test "${#ENGINE_REF}" -eq 40
          case "$REQUEST_ID" in
            (*[!A-Za-z0-9_-]*|'') exit 2 ;;
          esac
          test "${#REQUEST_ID}" -eq 22
          test "$POLICY_VERSION" = "1"
          test "$COOLDOWN_DAYS" = "14"
          test "$INCLUDE_MAJOR" = "false" -o "$INCLUDE_MAJOR" = "true"

      - name: Check out the exact requested project commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.base_commit }}
          fetch-depth: 0
          path: project
          persist-credentials: true

      - name: Check out the pinned Vuelta engine
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: luckyfoxdesign/vuelta
          ref: ${{ inputs.engine_ref }}
          path: engine
          persist-credentials: false

      - name: Set up the engine toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Build the pinned Vuelta engine
        working-directory: engine
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o "$RUNNER_TEMP/vuelta" ./cmd/vuelta

      - name: Verify the exact clean base
        working-directory: project
        env:
          BASE_COMMIT: ${{ inputs.base_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_COMMIT"
          test -z "$(git status --porcelain=v1)"

      - name: Bootstrap the ephemeral runner policy
        run: |
          "$RUNNER_TEMP/vuelta" --no-input config init --yes
          "$RUNNER_TEMP/vuelta" --no-input environment bootstrap --socket /var/run/docker.sock --yes

      - name: Rediscover delayed-latest candidates
        working-directory: project
        run: |
          "$RUNNER_TEMP/vuelta" --no-input scan --directory "$PWD" --min-release-age 14d --json \
            > "$RUNNER_TEMP/vuelta-scan.json"

      - name: Apply, verify, commit, and push one reviewed resolution
        id: result
        working-directory: project
        env:
          INCLUDE_MAJOR: ${{ inputs.include_major }}
        run: |
          args=(--directory "$PWD" --routine-only --yes --json)
          if test "$INCLUDE_MAJOR" = "true"; then
            args+=(--include-major)
          fi
          "$RUNNER_TEMP/vuelta" --no-input update local "${args[@]}" \
            > "$RUNNER_TEMP/vuelta-update.json"
          branch="$(jq -er '.results[0].push | select(type == "string" and length > 0)' "$RUNNER_TEMP/vuelta-update.json")"
          case "$branch" in
            (*[!A-Za-z0-9._/-]*|*..*|'') exit 2 ;;
          esac
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"

      - name: Create the review pull request
        id: pull_request
        env:
          BRANCH: ${{ steps.result.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state all --json url --jq '.[0].url // empty')"
          if test -z "$url"; then
            url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$GITHUB_REF_NAME" \
              --head "$BRANCH" \
              --title "chore(deps): delayed-latest dependency update" \
              --body "Created by Vuelta after fresh candidate discovery, security gates, changed-path validation, and the repository test profile.")"
          fi
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          printf 'Pull request: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
