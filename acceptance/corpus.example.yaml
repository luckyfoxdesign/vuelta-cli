schema_version: 1
cases:
  - name: express-npm-manifest-only
    url: https://github.com/expressjs/express
    commit: ae6dd37680e3a00618d6c8a3e522f0ee4eeba1a4
    subdir: ""
    expected_stack: node
    expected_package_manager: npm
    expected_lock_format: absent
    license: MIT
    features:
      - manifest-without-lockfile
      - single-package
    scenarios:
      - name: default
        args: []
        expect:
          allowed_statuses:
            - partial
          allowed_exit_codes:
            - 6
          allow_partial: true
          capabilities:
            - name: package_updates
              status: unavailable
              reason_contains: lockfile

