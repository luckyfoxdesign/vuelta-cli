services:
  test:
    build: .
    working_dir: /src
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
    command: ["go", "test", "./..."]

  race:
    build: .
    working_dir: /src
    environment:
      CGO_ENABLED: "1"
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
    command: ["go", "test", "-race", "./..."]

  lint:
    image: golangci/golangci-lint:v2.12.2-alpine@sha256:91b27804074a0bacea298707f016911e60cf0cdbc6c7bf5ccacb5f0606d18d60
    working_dir: /src
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
    command: ["golangci-lint", "run", "./..."]

  tidy:
    build: .
    working_dir: /src
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
    command: ["go", "mod", "tidy"]

  build:
    build: .
    working_dir: /src
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
    command: ["go", "build", "./..."]

  real-engine:
    profiles: ["acceptance"]
    build: .
    working_dir: /src
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
    command: ["go", "test", "-tags=realengine", "-count=1", "-timeout=45m", "./acceptance"]

  corpus:
    profiles: ["corpus"]
    build: .
    working_dir: /src
    volumes:
      - .:/src
      - ./acceptance/corpus.example.yaml:/src/acceptance/corpus.example.yaml:ro
      - go-mod-cache:/go/pkg/mod
    entrypoint: ["go", "run", "./cmd/vuelta-corpus"]
    command: []

volumes:
  go-mod-cache:
