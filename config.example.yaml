# Generate a private machine config with `vuelta config init`, then attest Docker:
# vuelta environment bootstrap --socket /absolute/path/to/docker.sock --yes
# Never put token values in YAML. Schema 1 keeps legacy data compatibility;
# verification/Git/history/deploy settings grant no execution authority.
schema_version: 1

# Bootstrap writes ordered docker.developer_endpoints with exact daemon identity.
# Linux Engine: /var/run/docker.sock
# Docker Desktop macOS: /Users/YOU/.docker/run/docker.sock
vuln_scan:
  # Exactly one dependency/lock-file source: trivy | osv-scanner | github-dependabot.
  # This replaces vuln_scan.tool and github_advisories.enabled. Delete those
  # legacy keys when recreating the config: source selection is fail-closed.
  dependency_source: trivy
  # Required only for a trivy or osv-scanner dependency source; omit it for
  # github-dependabot. This security-scanner pin is maintained as a reviewed
  # release input and is unrelated to adaptive package-scanner defaults.
  # Pin the multi-platform OCI index, not an architecture-specific manifest.
  image: "aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f"
  # For dependency_source: osv-scanner use ghcr.io/google/osv-scanner@sha256:c41702c554122e8491c996b661d085919e42d54d49cfb9f2473beb5a3dfdf628.
  fail_on_severity: HIGH  # CRITICAL | HIGH | MEDIUM
  database_max_age_hours: 24  # stale/unreachable DB is a security-gate error, not a "clean" result
  policy_file: ".vuelta-vulnerability-policy.yaml"  # optional, tracked, time-bounded exceptions only
  image_scan:
    enabled: true
    tool: trivy          # trivy is the required portable scanner; docker_scout is optional enrichment
    image: "aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f"
    platforms: ["linux/amd64"]
    vex: auto            # apply verified VEX attestations if the registry/DHI publishes them

github_advisories:
  api_url: "https://api.github.com"  # swap for a GitHub Enterprise URL if needed; https on port 443 only, no credentials in the URL
  token_env: "GITHUB_TOKEN"          # optional for public repos; read-only token, never passed into containers; allowed names: GITHUB_TOKEN, GH_TOKEN, VUELTA_GITHUB_TOKEN
  # Used only when dependency_source is github-dependabot. That selected source
  # is always fail-closed; private repositories need Dependabot alerts: read.

# Existing schema name retained for container repair policy.
update:
  min_release_age_days: 14 # legacy schema field; no scheduled-update age gate runs
  egress:
    network: vuelta-cli-update-egress
    proxy_container: vuelta-cli-egress-proxy
    proxy_url: http://vuelta-cli-egress-proxy:3128
  # toolchain_profiles: [] # optional explicit digest-pinned operator overrides
workspaces: [] # add exact projects with `vuelta project add PATH --yes`
